name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Called by update-translations.yml after the bot pushes: pushes made with
  # GITHUB_TOKEN never trigger the `push` event above, so without this call
  # auto-updated translations would not reach the site.
  workflow_call:
    inputs:
      ref:
        description: "Commit to build (the caller's github.sha predates its own push)"
        type: string
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Without this, setup-node prefers the runner image's cached 24.x,
          # which lags the security releases this pin exists to pick up.
          check-latest: true

      - name: Enable Corepack and install dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Build site
        run: yarn docs:build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
