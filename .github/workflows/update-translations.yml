name: Update Translations

on:
  schedule:
    - cron: "0 8 * * 1,4" # Monday and Thursday at 08:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Force retranslate all files (not just outdated)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack and install dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Sync upstream
        run: yarn sync

      - name: Check for outdated translations
        id: check
        run: |
          STATUS=$(yarn status 2>&1)
          echo "$STATUS"
          if echo "$STATUS" | grep -q "outdated\|new"; then
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write .env
        run: printenv ENV_FILE > .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}

      - name: Translate outdated files
        if: steps.check.outputs.has_updates == 'true' || inputs.force
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            yarn translate --lang=all --all --force
          else
            yarn translate --lang=all --outdated
          fi

      - name: Commit and push
        if: steps.check.outputs.has_updates == 'true' || inputs.force
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add original translation.lock.json translations/
          git diff --cached --quiet && exit 0
          git commit -m "👽 Auto-update translations for upstream changes"
          git push
