name: Update Translations

on:
  schedule:
    - cron: "0 8 * * 1,4" # Monday and Thursday at 08:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Force retranslate all files (not just outdated)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      # Set only when a commit was pushed; empty = nothing to deploy.
      pushed_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Without this, setup-node prefers the runner image's cached 24.x,
          # which lags the security releases this pin exists to pick up.
          check-latest: true

      - name: Enable Corepack and install dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Sync upstream
        run: yarn sync

      - name: Check for outdated translations
        id: check
        run: |
          STATUS=$(yarn status 2>&1)
          echo "$STATUS"
          if echo "$STATUS" | grep -q "outdated\|new"; then
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write .env
        run: printenv ENV_FILE > .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}

      - name: Verify provider/key works
        if: steps.check.outputs.has_updates == 'true' || inputs.force
        run: yarn check

      - name: Translate outdated files
        if: steps.check.outputs.has_updates == 'true' || inputs.force
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            yarn translate --lang=all --all --force
          else
            yarn translate --lang=all --outdated
          fi

      # Belt and braces: translate.ts refuses to write an incomplete translation,
      # but fail loudly if any file in translations/ is still structurally broken.
      - name: Audit translation completeness
        if: steps.check.outputs.has_updates == 'true' || inputs.force
        run: yarn check:translations

      - name: Commit and push
        id: commit
        if: steps.check.outputs.has_updates == 'true' || inputs.force
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add original translation.lock.json translations/
          git diff --cached --quiet && exit 0
          CHANGED=$(git diff --cached --name-only -- translations/ | sed 's|translations/||' | sort)
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "🤖 Auto-update translations ($DATE)" -m "Changed files:" -m "$CHANGED"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # A push made with GITHUB_TOKEN does not trigger deploy.yml's `push` event,
  # so deploy explicitly — as a reusable workflow, in this same run, so a
  # broken build fails the scheduled run you get notified about.
  deploy:
    needs: update
    if: needs.update.outputs.pushed_sha != ''
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.update.outputs.pushed_sha }}
